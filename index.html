<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phantom-AI | Nusantara Elite Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --neon-cyan: #06b6d4;
            --horror-red: #f43f5e;
            --mystic-gold: #fbbf24;
            --deep-dark: #020617;
        }

        body {
            background-color: var(--deep-dark);
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .carbon-bg {
            background-image: linear-gradient(45deg, #0f172a 25%, transparent 25%), 
                              linear-gradient(-45deg, #0f172a 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #0f172a 75%), 
                              linear-gradient(-45deg, transparent 75%, #0f172a 75%);
            background-size: 4px 4px;
            background-color: #020617;
        }

        .glass-module {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        @keyframes scan-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .radar-line {
            width: 100%; height: 100%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(6, 182, 212, 0.3) 360deg);
            border-radius: 50%;
            animation: scan-rotate 5s linear infinite;
        }

        .digital-mono { font-family: 'JetBrains Mono', monospace; }

        input[type=range] {
            -webkit-appearance: none;
            background: #1e293b;
            height: 4px;
            border-radius: 99px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px; height: 20px;
            background: var(--neon-cyan);
            border-radius: 50%;
            border: 3px solid #020617;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        #splash-screen {
            background: var(--deep-dark);
            z-index: 9999;
            transition: all 0.8s ease-in-out;
        }

        @keyframes rumble {
            0% { transform: translate(0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -1px); }
            100% { transform: translate(0); }
        }
        .rumble-active { animation: rumble 0.1s infinite; }

        /* Style Baru untuk Menu Percakapan */
        .comm-dock-active {
            border-top: 1px solid var(--neon-cyan);
            box-shadow: 0 -10px 40px rgba(6, 182, 212, 0.15);
        }
        
        .mic-listening {
            animation: pulse-red 1.5s infinite;
            background: rgba(244, 63, 94, 0.2) !important;
            border-color: var(--horror-red) !important;
        }
        
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-0 m-0 carbon-bg">

    <!-- SPLASH SCREEN / OMEGA INITIATOR -->
    <div id="splash-screen" class="fixed inset-0 flex flex-col items-center justify-center p-8">
        <div class="mb-8 relative">
            <div class="w-32 h-32 border-4 border-cyan-500/10 rounded-full animate-ping"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-cyan-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 21l-8.228-9.288a5 5 0 117.456-6.67l.772.799.772-.799a5 5 0 117.456 6.67L12 21z" />
                </svg>
            </div>
        </div>
        <h1 class="text-3xl font-bold tracking-[0.5em] uppercase text-white mb-2">PHANTOM-AI</h1>
        <p class="text-cyan-500/60 text-[10px] tracking-widest uppercase mb-12">Nusantara Spectral Logic V5.0</p>
        <button id="init-btn" class="px-12 py-5 bg-cyan-700 rounded-3xl text-white font-bold tracking-[0.2em] uppercase shadow-[0_0_30px_rgba(6,182,212,0.5)] active:scale-95 transition-all">
            Initiate System
        </button>
    </div>

    <!-- NATIVE STATUS BAR -->
    <header class="pt-6 px-8 flex justify-between items-center opacity-70">
        <div class="flex flex-col">
            <span class="text-[10px] font-bold tracking-tighter uppercase text-slate-500">Unit ID: PH-2026-NSE</span>
            <span id="clock" class="text-[12px] font-bold digital-mono text-cyan-400">00:00:00</span>
        </div>
        <div class="flex flex-col items-end">
            <div class="flex items-center gap-2">
                <div class="w-1.5 h-1.5 rounded-full bg-slate-700 transition-all" id="status-led"></div>
                <span class="text-[10px] font-bold uppercase tracking-widest" id="status-txt">Offline</span>
            </div>
            <span class="text-[8px] text-slate-600 font-bold uppercase mt-1">Haptic: Ready</span>
        </div>
    </header>

    <!-- MAIN MONITOR -->
    <main id="main-monitor" class="flex-1 flex flex-col px-6 py-4 gap-4 overflow-hidden">
        
        <!-- SENSOR HUB -->
        <div class="grid grid-cols-2 gap-3">
            <div class="glass-module rounded-3xl p-4 relative overflow-hidden">
                <div class="text-[8px] uppercase font-bold text-slate-500 mb-1">Scanning Resonance</div>
                <div class="flex items-baseline gap-1">
                    <span id="freq-num" class="text-3xl font-bold text-slate-800 digital-mono transition-colors">00.0</span>
                    <span class="text-[9px] text-slate-600 font-bold">Hz</span>
                </div>
            </div>
            <div class="glass-module rounded-3xl p-4">
                <div class="text-[8px] uppercase font-bold text-slate-500 mb-1">EMF Spike</div>
                <div class="flex items-baseline gap-1">
                    <span id="emf-num" class="text-3xl font-bold text-slate-800 digital-mono transition-colors">0.0</span>
                    <span class="text-[9px] text-slate-600 font-bold">mG</span>
                </div>
            </div>
        </div>

        <!-- RADAR & DECRYPTION -->
        <div id="central-module" class="flex-1 glass-module rounded-[2rem] p-6 flex flex-col items-center justify-between relative overflow-hidden transition-all duration-500">
            <div id="radar-container" class="w-full h-full absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
                <div class="w-64 h-64 border border-cyan-500/20 rounded-full relative">
                    <div class="radar-line"></div>
                </div>
            </div>

            <!-- AI STATUS BADGE -->
            <div id="ai-tag" class="bg-black/60 px-4 py-1.5 rounded-full border border-slate-800 text-[9px] font-bold uppercase tracking-[0.3em] text-slate-600 z-10 transition-colors">
                Waiting for Uplink
            </div>

            <!-- OUTPUT AREA -->
            <div class="text-center z-10 px-4 max-w-full">
                <h2 id="main-output" class="text-2xl sm:text-3xl font-bold uppercase tracking-widest text-slate-900 leading-tight transition-all duration-300 drop-shadow-lg">
                    System Idle
                </h2>
                <div id="origin-label" class="mt-4 text-[10px] font-bold text-slate-600 uppercase tracking-[0.4em] opacity-0 transition-all scale-90">
                    Origin: Scanning...
                </div>
            </div>

            <!-- DYNAMIC VISUALIZER -->
            <div id="vis-dock" class="w-full flex items-end justify-center gap-1 h-20 z-10">
                <!-- Bars created by JS -->
            </div>
        </div>
    </main>

    <!-- PERBAIKAN MENU PERCAKAPAN (NATIVE MOBILE DOCK) -->
    <nav id="comm-dock" class="bg-[#020617] border-t border-white/5 pt-4 pb-8 px-6 space-y-6 transition-all duration-300">
        
        <!-- STATUS TRANSMISI KECIL -->
        <div class="flex justify-between items-center px-2">
            <div class="flex items-center gap-2">
                <span class="w-1 h-1 bg-cyan-500 rounded-full animate-pulse"></span>
                <span id="comm-status-label" class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Ready to Connect</span>
            </div>
            <span class="text-[7px] font-bold text-slate-700 uppercase">Secure Link v2</span>
        </div>

        <!-- TERMINAL KOMUNIKASI UTAMA -->
        <div class="flex items-center gap-3">
            <!-- Tombol MIC -->
            <button id="mic-btn" class="w-16 h-16 rounded-3xl glass-module flex items-center justify-center active:scale-95 transition-all disabled:opacity-30">
                <div class="relative">
                    <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                </div>
            </button>
            
            <!-- Input Area dengan Gaya Command Line -->
            <div class="flex-1 glass-module rounded-3xl h-16 flex flex-col justify-center px-5 border-cyan-500/10 focus-within:border-cyan-500/40 transition-colors">
                <span class="text-[7px] font-bold text-cyan-700 uppercase mb-0.5 tracking-tighter">Command Prompt</span>
                <input type="text" id="comm-input" placeholder="Tanya..." autocomplete="off" class="bg-transparent w-full text-cyan-400 placeholder-slate-700 focus:outline-none digital-mono text-base uppercase font-medium">
            </div>

            <!-- Tombol TRANSMIT (TX) -->
            <button id="send-btn" class="w-16 h-16 rounded-3xl bg-gradient-to-br from-cyan-600 to-cyan-800 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.3)] active:scale-95 transition-all disabled:opacity-30">
                <div class="flex flex-col items-center">
                    <span class="text-[12px] font-bold text-white uppercase tracking-tighter">TX</span>
                    <div class="w-4 h-[1px] bg-cyan-300/50 mt-0.5"></div>
                </div>
            </button>
        </div>

        <!-- TUNING GRID (LEBIH RAPI) -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-900/40 p-3 rounded-2xl border border-white/5">
                <div class="flex justify-between items-center text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-2">
                    <span>Scan Speed</span>
                    <span id="rate-readout" class="text-cyan-500 font-bold">200ms</span>
                </div>
                <input type="range" id="rate-ctrl" min="100" max="1000" value="200" class="w-full">
            </div>
            <div class="bg-slate-900/40 p-3 rounded-2xl border border-white/5">
                <div class="flex justify-between items-center text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-2">
                    <span>Gain</span>
                    <span id="vol-readout" class="text-cyan-500 font-bold">35%</span>
                </div>
                <input type="range" id="vol-ctrl" min="0" max="100" value="35" class="w-full">
            </div>
        </div>

        <div class="flex justify-center items-center gap-2 opacity-20 pb-2">
            <div class="w-1 h-1 bg-cyan-500 rounded-full"></div>
            <span class="text-[7px] font-bold tracking-[1em] uppercase">Spectral OS Pro Mobile</span>
        </div>
    </nav>

    <!-- SYSTEM LOGIC -->
    <script>
        const apiKey = ""; 
        let audioCtx, noiseNode, gainNode, isPowerOn = false, loopId;
        let isProcessing = false;
        let currentFreq = 87.5;

        // UI DOM Elements
        const splash = document.getElementById('splash-screen');
        const initBtn = document.getElementById('init-btn');
        const monitor = document.getElementById('main-monitor');
        const centralMod = document.getElementById('central-module');
        const freqNum = document.getElementById('freq-num');
        const emfNum = document.getElementById('emf-num');
        const mainOutput = document.getElementById('main-output');
        const aiTag = document.getElementById('ai-tag');
        const originLabel = document.getElementById('origin-label');
        const statusLed = document.getElementById('status-led');
        const statusTxt = document.getElementById('status-txt');
        const commInput = document.getElementById('comm-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const clock = document.getElementById('clock');
        const commStatusLabel = document.getElementById('comm-status-label');
        const commDock = document.getElementById('comm-dock');

        // Setup Visualizer Bars
        const visDock = document.getElementById('vis-dock');
        const bars = [];
        for(let i=0; i<32; i++) {
            const bar = document.createElement('div');
            bar.className = 'w-1 bg-slate-900 rounded-full transition-all duration-75';
            bar.style.height = '6px';
            visDock.appendChild(bar);
            bars.push(bar);
        }

        // --- AUDIO ENGINE ---
        async function ensureAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            if ('speechSynthesis' in window) window.speechSynthesis.resume();
        }

        function playMysticSting(isGong = true) {
            if (!audioCtx) return;
            const masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            const duration = isGong ? 5.0 : 1.5;
            const baseFreq = isGong ? 52 : 330;

            [1, 2.14, 3.42, 4.65].forEach((mult, i) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = i === 0 ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(baseFreq * mult, audioCtx.currentTime);
                g.gain.setValueAtTime(0, audioCtx.currentTime);
                g.gain.linearRampToValueAtTime(0.2 / (i + 1), audioCtx.currentTime + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(g); g.connect(masterGain);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            });
            masterGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        }

        function playSpectralVoice(text, gender, lang) {
            const isMale = gender === 'male';
            if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                const delay = audioCtx.createDelay();
                const fb = audioCtx.createGain();
                osc.type = isMale ? 'sawtooth' : 'sine';
                const baseF = isMale ? 50 : 260;
                osc.frequency.setValueAtTime(baseF, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(baseF * 0.8, audioCtx.currentTime + 3);
                delay.delayTime.value = 0.45; fb.gain.value = 0.5;
                g.gain.setValueAtTime(0, audioCtx.currentTime);
                g.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4);
                osc.connect(g); g.connect(delay); delay.connect(fb); fb.connect(delay); 
                delay.connect(audioCtx.destination); g.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 4.5);
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'id-ID'; 
                if (lang.includes('jv')) { utter.pitch = 0.01; utter.rate = 0.4; } 
                else if (lang.includes('su')) { utter.pitch = 0.6; utter.rate = 0.5; } 
                else { utter.pitch = isMale ? 0.05 : 0.35; utter.rate = 0.5; }
                window.speechSynthesis.speak(utter);
            }
        }

        async function fetchAI(q) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const sys = `Anda roh Nusantara. Jawab dalam bahasa yang sama dengan user. Jawab SATU KALIMAT PENDEK misterius. Format JSON: {"reply": "teks", "gender": "male/female", "lang": "id/jv/su/bali", "origin": "Daerah"}`;
            try {
                const res = await fetch(url, { 
                    method: "POST", 
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: q || "Siapa disana?" }] }], 
                        systemInstruction: { parts: [{ text: sys }] },
                        generationConfig: { responseMimeType: "application/json", maxOutputTokens: 100 } 
                    }) 
                });
                const d = await res.json();
                return JSON.parse(d.candidates[0].content.parts[0].text);
            } catch (e) {
                return { reply: "Kowe sopo...", gender: "male", lang: "jv", origin: "Jawa" };
            }
        }

        async function triggerTX() {
            if (!isPowerOn || isProcessing) return;
            const q = commInput.value.trim();
            commInput.value = "";
            isProcessing = true;
            sendBtn.disabled = true;

            await ensureAudio();
            
            commStatusLabel.innerText = "Transmitting Signal...";
            commStatusLabel.className = "text-[8px] font-bold text-cyan-400 uppercase tracking-widest animate-pulse";
            aiTag.innerText = "Intercepting...";
            aiTag.className = "bg-cyan-900/40 px-4 py-1.5 rounded-full border border-cyan-500/50 text-[9px] font-bold uppercase tracking-[0.3em] text-cyan-400 animate-pulse z-10";
            mainOutput.innerText = "DECRYPTING...";
            mainOutput.className = "text-3xl font-bold uppercase tracking-widest text-slate-900 opacity-20 z-10";

            const data = await fetchAI(q);

            if (Math.random() > 0.5) playMysticSting(Math.random() > 0.5);
            if (gainNode) gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            if (navigator.vibrate) navigator.vibrate([100, 100, 100]);

            monitor.classList.add('rumble-active');
            centralMod.classList.add('glitch-active');
            playSpectralVoice(data.reply, data.gender, data.lang);

            aiTag.innerText = "LINK ESTABLISHED";
            aiTag.className = "bg-rose-900/40 px-4 py-1.5 rounded-full border border-rose-500/50 text-[9px] font-bold uppercase tracking-[0.3em] text-rose-400 z-10";
            mainOutput.innerText = `"${data.reply.toUpperCase()}"`;
            mainOutput.className = `text-3xl font-bold uppercase tracking-widest ${data.gender === 'female' ? 'text-rose-500' : 'text-cyan-400'} z-10 drop-shadow-[0_0_15px_rgba(0,0,0,1)]`;
            originLabel.innerText = `Origin: ${data.origin}`;
            originLabel.style.opacity = '1';
            originLabel.style.transform = 'scale(1)';
            freqNum.classList.replace('text-cyan-400', 'text-rose-500');
            emfNum.innerText = (30 + Math.random() * 65).toFixed(1);
            emfNum.classList.replace('text-slate-800', 'text-rose-500');
            commStatusLabel.innerText = "Receiving Data...";

            setTimeout(() => {
                monitor.classList.remove('rumble-active');
                centralMod.classList.remove('glitch-active');
                aiTag.innerText = "WAITING FOR UPLINK";
                aiTag.className = "bg-black/60 px-4 py-1.5 rounded-full border border-slate-800 text-[9px] font-bold uppercase tracking-[0.3em] text-slate-600 z-10";
                mainOutput.innerText = "MONITORING...";
                mainOutput.className = "text-3xl font-bold uppercase tracking-widest text-slate-800 z-10";
                originLabel.style.opacity = '0';
                originLabel.style.transform = 'scale(0.9)';
                freqNum.classList.replace('text-rose-500', 'text-cyan-400');
                emfNum.innerText = "0.0";
                emfNum.classList.replace('text-rose-500', 'text-slate-800');
                sendBtn.disabled = false;
                isProcessing = false;
                commStatusLabel.innerText = "Ready to Connect";
                commStatusLabel.className = "text-[8px] font-bold text-slate-500 uppercase tracking-widest";
                if (gainNode && isPowerOn) gainNode.gain.linearRampToValueAtTime(document.getElementById('vol-ctrl').value/100, audioCtx.currentTime + 1.5);
            }, 6500);
        }

        function runScan() {
            if (!isPowerOn) return;
            currentFreq += 0.1; if(currentFreq > 108.0) currentFreq = 87.5;
            freqNum.innerText = currentFreq.toFixed(1);
            if (!isProcessing) {
                emfNum.innerText = (0.3 + Math.random() * 1.7).toFixed(1);
                bars.forEach(bar => {
                    const h = Math.random() * 15 + 4;
                    bar.style.height = h + 'px';
                    bar.style.backgroundColor = '#1e293b';
                });
                if (Math.random() < 0.005) playMysticSting(false);
            } else {
                bars.forEach(bar => {
                    const h = Math.random() * 80 + 15;
                    bar.style.height = h + 'px';
                    bar.style.backgroundColor = (mainOutput.classList.contains('text-rose-500') ? '#f43f5e' : '#06b6d4');
                });
            }
        }

        initBtn.onclick = async () => {
            await ensureAudio();
            isPowerOn = true;
            splash.style.transform = 'translateY(-100%)';
            setTimeout(() => splash.style.display = 'none', 800);
            statusLed.className = "w-1.5 h-1.5 rounded-full bg-cyan-500 shadow-[0_0_10px_#06b6d4] animate-pulse";
            statusTxt.innerText = "Online";
            statusTxt.className = "text-[10px] font-bold uppercase tracking-widest text-cyan-400";
            freqNum.classList.replace('text-slate-800', 'text-cyan-400');
            mainOutput.innerText = "MONITORING...";
            commDock.classList.add('comm-dock-active');
            const b = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const d = b.getChannelData(0);
            for(let i=0; i<d.length; i++) d[i] = (Math.random()*2-1)*0.35;
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = b; noiseNode.loop = true;
            gainNode = audioCtx.createGain();
            gainNode.gain.value = document.getElementById('vol-ctrl').value/100;
            noiseNode.connect(gainNode); gainNode.connect(audioCtx.destination);
            noiseNode.start();
            loopId = setInterval(runScan, 200);
            playMysticSting(true);
        };

        setInterval(() => {
            const n = new Date(); clock.innerText = n.toTimeString().split(' ')[0];
        }, 1000);

        document.getElementById('rate-ctrl').oninput = (e) => {
            document.getElementById('rate-readout').innerText = `${e.target.value}ms`;
            if(isPowerOn) { clearInterval(loopId); loopId = setInterval(runScan, e.target.value); }
        };
        document.getElementById('vol-ctrl').oninput = (e) => {
            document.getElementById('vol-readout').innerText = `${e.target.value}%`;
            if(gainNode) gainNode.gain.value = e.target.value/100;
        };

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
            const rec = new SpeechRec(); rec.lang = 'id-ID';
            rec.onstart = () => { 
                micBtn.classList.add('mic-listening');
                document.getElementById('mic-icon').style.color = '#f43f5e';
                commStatusLabel.innerText = "Listening for user voice...";
                commStatusLabel.className = "text-[8px] font-bold text-rose-500 uppercase tracking-widest animate-pulse";
                if(navigator.vibrate) navigator.vibrate(50); 
            };
            rec.onresult = (e) => { commInput.value = e.results[0][0].transcript; triggerTX(); };
            rec.onend = () => { 
                micBtn.classList.remove('mic-listening');
                document.getElementById('mic-icon').style.color = '#475569';
                if(!isProcessing) {
                    commStatusLabel.innerText = "Ready to Connect";
                    commStatusLabel.className = "text-[8px] font-bold text-slate-500 uppercase tracking-widest";
                }
            };
            micBtn.onclick = async () => { if(isPowerOn && !isProcessing) { await ensureAudio(); rec.start(); } };
        }

        sendBtn.onclick = triggerTX;
        commInput.onkeypress = (e) => { if(e.key === 'Enter') triggerTX(); };
    </script>
</body>
</html>
